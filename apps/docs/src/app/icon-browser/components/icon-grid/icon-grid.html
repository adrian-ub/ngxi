<cdk-virtual-scroll-viewport
  #viewport
  itemSize="130"
  class="grid-viewport custom-scrollbar overflow-y-auto"
  [style.height]="viewportHeight() ? viewportHeight() + 'px' : '40vh'"
>
  <div
    *cdkVirtualFor="let row of rows; trackBy: trackByRow"
    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8"
  >
    @for (entry of row; track entry.name) {
    <button
      type="button"
      (click)="iconSelect.emit(entry)"
      class="icon-cell group flex flex-col items-center gap-2.5 border border-border bg-background p-4 -mb-px -mr-px transition-transform duration-100 hover:bg-accent active:scale-[0.92] focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
      [title]="entry.name + (entry.aliasOf ? ' (alias of ' + entry.aliasOf + ')' : '')"
    >
      <div class="flex h-10 w-10 items-center justify-center text-foreground">
        <app-dynamic-icon
          class="h-5 w-5"
          [entry]="entry"
          [bundle]="bundle()"
          [inputs]="{ width: 20, height: 20 }"
        ></app-dynamic-icon>
      </div>
      <span
        class="icon-name truncate font-mono text-[10px] text-muted-foreground group-hover:text-foreground"
        >{{ entry.name }}</span
      >
      @if (entry.aliasOf) {
      <span
        class="alias-tag truncate font-mono text-[9px] text-muted-foreground/60"
        >alias of {{ entry.aliasOf }}</span
      >
      }
    </button>
    }
  </div>

  @if (entries().length === 0) {
  <div class="flex flex-col items-center gap-4 py-20 text-center">
    <p class="font-mono text-sm text-muted-foreground">no icons found</p>
    <button
      type="button"
      (click)="clearSearch.emit()"
      class="border border-border bg-background px-2.5 py-1 font-mono text-xs text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
    >
      [clear search]
    </button>
  </div>
  }
</cdk-virtual-scroll-viewport>
