<button
  type="button"
  cdkCopyToClipboard
  [cdkCopyToClipboard]="installCommand()"
  (cdkCopyToClipboardCopied)="onInstallCopied()"
  class="group flex w-full max-w-full items-center gap-3 overflow-hidden border border-border bg-card px-4 py-3 font-mono text-sm text-muted-foreground transition-colors hover:border-foreground/20 hover:text-foreground sm:w-auto"
>
  <span class="select-none text-muted-foreground/50">$</span>
  <span class="min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">{{
    installCommand()
  }}</span>
  <span
    class="ml-auto text-muted-foreground/40 transition-colors group-hover:text-foreground/60"
  >
    @if (installCopied()) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="14"
        height="14"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    } @else {
      <svg
        class="h-3.5 w-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect width="14" height="14" x="8" y="8"></rect>
        <path
          d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
        ></path>
      </svg>
    }
  </span>
</button>
