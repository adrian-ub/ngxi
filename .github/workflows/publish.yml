name: Publish

# Manual publish of every package to npm (workflow_dispatch). The daily
# Iconify icon sets update workflow already publishes only the changed
# libraries in-process; this job is the safety net / manual full release:
# it builds every library and publishes every version currently in the
# manifests that does not exist on the registry yet (e.g. the 1.0.0-beta.0
# transition), skipping versions that are already published.
#
# The npm dist-tag is chosen from the input (default beta). Trusted Publisher
# (OIDC) is used — no NODE_AUTH_TOKEN needed. Each package on npmjs.com must
# point its Trusted Publisher at
#   https://github.com/adrian-ub/ngxi/.github/workflows/publish.yml
# (npm configures trusted publishers per package, not per org/scope — 236
# packages, one entry each.) The publish job needs id-token: write for both
# the OIDC login and npm provenance signing.
#
# Fallback if OIDC is not configured everywhere: restore setup-node's
# registry-url and set NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} (already
# present in the repo secrets).
on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to apply to the published packages
        required: true
        default: beta
        type: choice
        options:
          - alpha
          - beta
          - next
          - latest

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publisher + npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # nx-release-publish publishes from dist/{projectRoot} and depends on
      # build (-> generate-icons -> update-reference), so running every
      # nx-release-publish target builds and publishes each library. The 12GB
      # heap cap matches the largest icon sets; parallel=2 keeps two heavy
      # builds from exceeding the runner's RAM (standard runner: 2 vCPU/7GB).
      - name: Publish all libraries
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NPM_CONFIG_PROVENANCE: true
          TAG: ${{ github.event.inputs.dist-tag }}
        run: pnpm exec nx release publish --tag "$TAG" --outputStyle=static