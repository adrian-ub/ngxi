name: Iconify sets tracker

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Compute missing icon sets
        run: node tools/scripts/missing-icon-sets.mjs /tmp/missing-prefixes.txt > /tmp/tracker-body.md

      - name: Scaffold missing icon sets and create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
        run: |
          set -euo pipefail

          # Scaffold all missing icon sets
          while IFS= read -r prefix; do
            echo "Scaffolding icon library: $prefix"
            pnpm nx g icon-library "$prefix" --no-interactive
          done < /tmp/missing-prefixes.txt

          # Exit early if nothing was generated
          if ! git diff --quiet HEAD; then
            BRANCH="chore/iconify-sets-update"
            git checkout -b "$BRANCH"
            git add .
            git config user.name 'UbLabs[bot]'
            git config user.email '92824821+ublabs[bot]@users.noreply.github.com'
            git commit -m "feat: scaffold missing Iconify icon sets"
            git fetch origin "$BRANCH" 2>/dev/null || true
            git push origin "$BRANCH" --force-with-lease

            # Create or update PR
            PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
            if [ -n "$PR_URL" ]; then
              PR_NUMBER="$(echo "$PR_URL" | sed -E 's#.*/pull/([0-9]+).*#\1#')"
              # REST PATCH: gh pr edit resolves the repo owner via GraphQL, which
              # requires read:org — PAT_GITHUB only has repo + workflow.
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                -F "body=$(cat /tmp/tracker-body.md)" >/dev/null
              echo "Updated PR: $PR_URL"
            else
              # REST POST: gh pr create uses the same owner GraphQL fragment and
              # fails with limited-scope tokens; the REST API only needs `repo`.
              PR_URL="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
                -f title="feat: scaffold missing Iconify icon sets" \
                -f head="$BRANCH" \
                -f base="main" \
                -F "body=$(cat /tmp/tracker-body.md)" \
                --jq '.html_url')"
              echo "Created PR: $PR_URL"
            fi
          else
            echo "No missing icon sets to scaffold"
          fi
