name: Iconify icon sets update

# Keep @iconify/json up to date with iconify/icon-sets (publishes several times
# a week). Runs DAILY; the first step checks the registry with taze BEFORE
# installing anything, so a no-change day costs ~1 minute.
#
# Only PATCH releases are auto-applied: @iconify/json ships icon-set updates as
# patch bumps on the same major.minor (2.2.525 -> 2.2.526). taze runs in 'patch'
# mode (stay on the current major AND minor); a minor/major bump is skipped so
# breaking changes never reach main without manual review.
#
# When a newer patch version exists and at least one icon set changed, this
# workflow releases ONLY the changed libraries (projectsRelationship:
# independent on every "@ngxi/<set>" package):
#   1. bump @iconify/json with taze and refresh the lockfile.
#   2. detect-changed-sets.mjs compares the per-package meta.json snapshot
#      (committed) against the installed @iconify/json and lists the sets whose
#      lastModified changed. packages/*/icon-set.json + src/lib/icons are
#      generated at BUILD time and are gitignored, so meta.json is the only
#      committed change signal.
#   3. refresh meta.json for the changed sets and commit that with the
#      dependency bump (`fix:` conventional commit, patch-level release).
#   4. nx release version --projects=<changed> --specifier prerelease --preid beta
#      bumps ONLY those packages (1.0.0-beta.0 -> 1.0.0-beta.1), commits with
#      per-package tags (@ngxi/<set>@<version>) and creates the GitHub releases.
#      An explicit prerelease specifier is required: a plain patch bump on a
#      prerelease version (1.0.0-beta.0) would resolve to 1.0.0 (stable).
#   5. derive the npm dist-tag (alpha/beta/next/latest) from the new version.
#   6. push to main with PAT_GITHUB — a personal token, NOT the built-in
#      GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not trigger other
#      workflows, so ci.yml would never run. With PAT_GITHUB the push fires
#      ci.yml (lint/test/e2e + build matrix on main). The per-package tags are
#      pushed along (the 3-tags-per-push GitHub Actions trigger limit does not
#      apply: nothing listens to package tags; publishing happens later).
#   7. trigger the Publish workflow (publish.yml) via workflow_dispatch with
#      the changed projects and the derived dist-tag. THIS is the workflow
#      that publishes to npm: npmjs.com Trusted Publishers are configured per
#      package and only authorize publish.yml's OIDC identity, so the daily
#      workflow must never publish itself (npm rejects its OIDC request with
#      E404). publish.yml builds the filtered projects itself — `nx release
#      publish --projects=...` does not expand the build dependency.
#
# Manual releases always win: running `nx release` locally (or the Publish
# workflow) switches any package to whatever version/tag you choose, and the
# next automatic update continues from there.
#
# WARNING: this publishes to npm with no human review — intentional. The
# safety net is npm versioning: a wrong publish can always be followed by a
# corrected one, and both Nx version and publish are idempotent on re-run.
on:
  schedule:
    - cron: '0 6 * * *' # every day 06:00 UTC
  workflow_dispatch:

concurrency:
  group: icon-update
  cancel-in-progress: false

# Nx Cloud reads the access token from the runner env. The workspace uses
# nxCloudId (not nxCloudAccessToken), so without this env var Nx falls back to
# the implicit GitHub-bound login, which returns 401 ("You do not have
# sufficient access to this workspace") and blocks every nx command.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Personal token: enables the push below to trigger ci.yml and the
          # whole chain. The built-in GITHUB_TOKEN cannot do this.
          token: ${{ secrets.PAT_GITHUB }}

      - name: Check for newer @iconify/json (patch only)
        id: check
        run: |
          # taze 'patch' mode only considers updates within the same major.minor
          # (2.2.525 -> 2.2.526): @iconify/json ships icon-set updates as patch
          # releases. Minor/major bumps never surface as an update here, so a
          # breaking change cannot reach main without manual review.
          JSON="$(npx --yes taze@21 --include @iconify/json patch --recursive --json --no-github-actions --no-node-version)"
          # Pipe the JSON through stdin: with --recursive the payload covers
          # every workspace manifest and can exceed the argv size limit.
          LATEST="$(printf '%s' "$JSON" | node -e '
            let input = "";
            process.stdin.on("data", (d) => (input += d));
            process.stdin.on("end", () => {
              const j = JSON.parse(input);
              const ups = (j.packages || []).flatMap((p) => p.resolved || []).filter((r) => r.update);
              if (ups.length === 0) process.exit(1);
              process.stdout.write(ups.map((u) => u.targetVersion.replace(/^[^0-9]*/, "")).sort().pop());
            });
          ' || true)"
          if [ -n "$LATEST" ]; then
            echo "patch update available: $LATEST"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "already up to date (no patch update)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.check.outputs.updated == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node
        if: steps.check.outputs.updated == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check.outputs.updated == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bump @iconify/json (patch only)
        if: steps.check.outputs.updated == 'true'
        run: |
          # taze writes the patch update to every workspace manifest that pins
          # @iconify/json (root devDependencies + tools/workspace-plugin
          # dependencies), preserving the existing range (^2.2.525).
          pnpm dlx taze@21 --include @iconify/json patch --recursive --write --no-github-actions --no-node-version
          # The manifest was just bumped, so the lockfile must be refreshed here
          # (CI defaults to frozen-lockfile and would fail).
          pnpm install --no-frozen-lockfile

      - name: Detect changed icon sets
        id: detect
        if: steps.check.outputs.updated == 'true'
        run: |
          node tools/scripts/detect-changed-sets.mjs /tmp/changed-sets.txt
          if [ -s /tmp/changed-sets.txt ]; then
            CHANGED="$(paste -sd, /tmp/changed-sets.txt)"
            echo "Changed sets: $CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "projects=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh meta.json snapshots
        if: steps.detect.outputs.changed == 'true'
        env:
          CHANGED: ${{ steps.detect.outputs.projects }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const changed = (process.env.CHANGED || "").split(",").filter(Boolean);
            for (const prefix of changed) {
              const data = JSON.parse(fs.readFileSync(`node_modules/@iconify/json/json/${prefix}.json`, "utf8"));
              const dest = path.join("packages", prefix, "meta.json");
              const meta = JSON.parse(fs.readFileSync(dest, "utf8"));
              meta.lastModified = data.lastModified;
              fs.writeFileSync(dest, JSON.stringify(meta, null, 2) + "\n");
            }
          '

      - name: Commit dependency bump + meta snapshots
        if: steps.detect.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name 'UbLabs[bot]'
          git config user.email '92824821+ublabs[bot]@users.noreply.github.com'
          git add -A
          # fix: -> patch-level conventional commit, matching the prerelease
          # release policy in the header comment.
          git commit -m "fix: update @iconify/json to v$LATEST"

      - name: Version changed packages
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          pnpm exec nx release version
          --projects="${{ steps.detect.outputs.projects }}"
          --specifier prerelease --preid beta

      - name: Derive npm dist-tag
        id: disttag
        if: steps.detect.outputs.changed == 'true'
        run: |
          FIRST="$(cut -d, -f1 <<< "${{ steps.detect.outputs.projects }}")"
          VER="$(node -e "process.stdout.write(require('./packages/' + process.argv[1] + '/package.json').version)" "$FIRST")"
          case "$VER" in
            *-alpha.*) TAG="alpha" ;;
            *-beta.*) TAG="beta" ;;
            *-rc.*) TAG="next" ;;
            *) TAG="latest" ;;
          esac
          echo "version=$VER dist_tag=$TAG"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push to main
        if: steps.detect.outputs.changed == 'true'
        run: |
          git push origin main --follow-tags

      - name: Trigger publish workflow
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.disttag.outputs.dist_tag }}
          PROJECTS: ${{ steps.detect.outputs.projects }}
        run: |
          gh workflow run publish.yml -f dist-tag="$DIST_TAG" -f projects="$PROJECTS"