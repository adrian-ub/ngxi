name: Iconify icon sets update

# Keep @iconify/json up to date with iconify/icon-sets (publishes several times
# a week). Runs DAILY; the first step checks the registry with taze BEFORE
# installing anything, so a no-change day costs ~1 minute.
#
# Only PATCH releases are auto-applied: @iconify/json ships icon-set updates as
# patch bumps on the same major.minor (2.2.525 -> 2.2.526). taze runs in 'patch'
# mode (stay on the current major AND minor); a minor/major bump is skipped so
# breaking changes never reach main without manual review.
#
# Releases are patch-only too: the bot commit uses `fix:` (the conventional
# commits type that bumps patch), and the explicit NEXT version only ever
# advances the prerelease counter (1.0.0-alpha.9 -> 1.0.0-alpha.10) or bumps
# patch when coming from a stable tag (1.0.0 -> 1.0.1-alpha.0).
#
# When a newer patch version exists, this workflow runs the FULL pipeline with NO
# pull request:
#   1. bump @iconify/json with taze (all workspace manifests) and refresh the
#      lockfile.
#      packages/*/icon-set.json + src/lib/icons are generated at BUILD time by
#      generate-icons and are gitignored, so the bot commit only carries the
#      dependency bump and the refreshed lockfile.
#   2. commit and push directly to main with PAT_GITHUB — a personal token,
#      NOT the built-in GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not
#      trigger other workflows, so ci.yml would never run. With PAT_GITHUB the
#      push fires ci.yml (lint/test/e2e + build matrix on main).
#   3. release in place with nx release: build everything, bump all packages to
#      the next version (computed from the last git tag), commit, tag vX.Y.Z,
#      push and create the GitHub release. The push fires ci.yml; the tag push
#      fires publish.yml (both because the checkout uses PAT_GITHUB).
#      The next version follows the prerelease branch of the last tag
#      (alpha -> alpha.1, beta -> beta.1, rc -> next, stable -> patch-alpha.0)
#      and the very first release is 1.0.0-alpha.0.
#      The explicit NEXT specifier is REQUIRED: Nx cannot read a prerelease git
#      tag as the current version ("No git tags matching pattern"), so nx.json
#      falls back to the versions in the package.json manifests
#      (fallbackCurrentVersionResolver: disk).
# Manual releases always win: running `nx release --skip-publish 1.0.0-beta.0`
# locally (or any tag push) switches the branch, and the next automatic update
# continues from there.
#
# WARNING: this publishes to npm with no human review — intentional. The
# safety net is npm versioning: a wrong publish can always be followed by a
# corrected one, and both Release and Publish are idempotent on re-run.
on:
  schedule:
    - cron: '0 6 * * *' # every day 06:00 UTC
  workflow_dispatch:

concurrency:
  group: icon-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Personal token: enables the push below to trigger ci.yml and the
          # whole chain. The built-in GITHUB_TOKEN cannot do this.
          token: ${{ secrets.PAT_GITHUB }}

      - name: Check for newer @iconify/json (patch only)
        id: check
        run: |
          # taze 'patch' mode only considers updates within the same major.minor
          # (2.2.525 -> 2.2.526): @iconify/json ships icon-set updates as patch
          # releases. Minor/major bumps never surface as an update here, so a
          # breaking change cannot reach main without manual review.
          JSON="$(npx --yes taze@21 --include @iconify/json patch --recursive --json --no-github-actions --no-node-version)"
          # Pipe the JSON through stdin: with --recursive the payload covers
          # every workspace manifest and can exceed the argv size limit.
          LATEST="$(printf '%s' "$JSON" | node -e '
            let input = "";
            process.stdin.on("data", (d) => (input += d));
            process.stdin.on("end", () => {
              const j = JSON.parse(input);
              const ups = (j.packages || []).flatMap((p) => p.resolved || []).filter((r) => r.update);
              if (ups.length === 0) process.exit(1);
              process.stdout.write(ups.map((u) => u.targetVersion.replace(/^[^0-9]*/, "")).sort().pop());
            });
          ' || true)"
          if [ -n "$LATEST" ]; then
            echo "patch update available: $LATEST"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          else
            echo "already up to date (no patch update)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.check.outputs.updated == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node
        if: steps.check.outputs.updated == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check.outputs.updated == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bump @iconify/json (patch only)
        if: steps.check.outputs.updated == 'true'
        run: |
          # taze writes the patch update to every workspace manifest that pins
          # @iconify/json (root devDependencies + tools/workspace-plugin
          # dependencies), preserving the existing range (^2.2.525).
          pnpm dlx taze@21 --include @iconify/json patch --recursive --write --no-github-actions --no-node-version
          # The manifest was just bumped, so the lockfile must be refreshed here
          # (CI defaults to frozen-lockfile and would fail).
          pnpm install --no-frozen-lockfile

      - name: Commit and push to main
        id: commit
        if: steps.check.outputs.updated == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated content changed; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'UbLabs[bot]'
          git config user.email '92824821+ublabs[bot]@users.noreply.github.com'
          git add -A
          # fix: -> patch-level conventional commit, matching the patch-only
          # release policy in the header comment.
          git commit -m "fix: update @iconify/json to v$LATEST"
          git pull --rebase origin main
          git push origin main
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.commit.outputs.release == 'true'
        run: |
          # Deliberately patch-only: a prerelease tag only advances the
          # prerelease counter (1.0.0-alpha.9 -> 1.0.0-alpha.10); a stable tag
          # opens a new prerelease with a patch bump (1.0.0 -> 1.0.1-alpha.0).
          # Icon-set updates never bump minor/major.
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            NEXT="1.0.0-alpha.0"
            echo "first release -> $NEXT"
          else
            NEXT="$(node -e '
              const v = process.argv[1].replace(/^v/, "");
              const m = v.match(/^(\d+)\.(\d+)\.(\d+)(?:-([a-zA-Z0-9]+)\.(\d+))?$/);
              if (m[4]) {
                console.log(m[1] + "." + m[2] + "." + m[3] + "-" + m[4] + "." + (Number(m[5]) + 1));
              } else {
                console.log(m[1] + "." + m[2] + "." + (Number(m[3]) + 1) + "-alpha.0");
              }
            ' "$LAST_TAG")"
            echo "last_tag=$LAST_TAG next=$NEXT"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Configure Git user for the release commit
        if: steps.commit.outputs.release == 'true'
        run: |
          git config user.name 'UbLabs[bot]'
          git config user.email '92824821+ublabs[bot]@users.noreply.github.com'

      # nx release does version -> changelog -> commit -> tag -> push -> GitHub
      # release. --skip-publish stops before npm (publish.yml runs on the tag
      # push). The push uses the PAT_GITHUB remote from checkout, so the tag
      # push fires publish.yml and the main push fires ci.yml.
      # The explicit NEXT specifier is required: Nx cannot read a prerelease
      # git tag as the current version, so it falls back to the manifest
      # versions on disk (which the previous release left at the last version).
      - name: Release (bump all packages, tag, GitHub release)
        if: steps.commit.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: pnpm exec nx release --skip-publish "$NEXT"
